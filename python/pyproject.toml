[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "mesa-sdk"
version = "0.46.0"
description = "Official Mesa Python SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Mesa", email = "support@mesa.dev" },
]
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
    "mesa-rest>=0.6.0",
    "pydantic>=2,<3",
    "typing-extensions>=4.4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://mesa.dev"
Repository = "https://github.com/mesa-dot-dev/sdks"
Issues = "https://github.com/mesa-dot-dev/sdks/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.0",
    "attrs>=24.0",
    "python-dateutil>=2.9",
    "psycopg[binary]>=3.3.4",
    "pytest-timeout>=2.4.0",
]

[tool.maturin]
manifest-path = "../../../crates/mesafs-py/Cargo.toml"
python-source = "src"
module-name = "mesa_sdk._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hard per-test wall-clock bound. A hung test (e.g. an unbounded native
# write/read) must fail with a stack dump rather than stall until the CI
# job's own timeout kills the whole suite with no diagnostics.
timeout = 60
timeout_method = "thread"
